<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>View Clinical Requests</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="app-header">
    <h1>Clinical Request System</h1>
  </header>

  <main class="container">
    <nav>
      <a href="index.html">Submit Request</a>
      <a href="requests.html">View Requests</a>
    </nav>

    <section class="card">
      <h2>Submitted Requests</h2>
      <p class="hint">Open a ticket to view comments and manage the request lifecycle.</p>

      <div id="requestsList"></div>
    </section>

    <!-- Modal Overlay -->
    <div id="modalBackdrop" class="modal-backdrop" onclick="closeTicketModal()"></div>
    <div id="ticketModal" class="modal" style="display: none;">
      <button class="modal-close" onclick="closeTicketModal()">✕</button>
      <div id="ticketDetail"></div>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
